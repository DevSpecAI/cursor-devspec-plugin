name: Cursor plugin checks

on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cursor-plugin-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Measured full suite runtime on ubuntu-latest is ~5m30s (run 45419793893,
    # dominated by real-timer settle waits in transcript-turn-end.test.mjs).
    # 15 minutes gives ~2.5x headroom while bounding any wedged child process.
    timeout-minutes: 15
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      # No private-repository credentials on public PR runners (matches DevSpec-Pi).
      # Server-source parity tests in server-tool-names.test.mjs run locally against
      # a clean DevSpecV2 checkout until the cross-plugin mechanism (task a14f4a6c) lands.
      - name: Run full Cursor plugin test suite in clean environment
        run: |
          TMPHOME="$(mktemp -d)"
          trap 'rm -rf "$TMPHOME"' EXIT
          # TEST_CONCURRENCY=2 is defined once and matches the 2-vCPU ubuntu-latest runner;
          # uncapped default concurrency starved child-process timers in room-command-recall.test.mjs
          # (run 45418068651), while concurrency=2 passed all 1,320 tests in 5m31s.
          TEST_CONCURRENCY=2
          env -i HOME="$TMPHOME" PATH="$PATH" node --test --test-concurrency="$TEST_CONCURRENCY" hooks/scripts/*.test.mjs scripts/*.test.mjs
